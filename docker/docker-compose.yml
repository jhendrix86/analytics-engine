version: '3.8'

services:
  analytics-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: analytics-engine
    ports:
      - "8042:8042"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/analytics
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}
      - DEBUG=${DEBUG:-false}
      - GLOBAL_STATE_MANAGER_URL=http://global-state-manager:8035
    # No depends_on here - postgres/redis moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped

networks:
  os42-shared:
    external: true
